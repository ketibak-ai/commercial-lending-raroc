name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check src tests evals
      - name: Unit, API and agent-loop tests
        run: pytest -q -p no:logging
      - name: Retrieval eval (offline)
        run: python evals/retrieval_eval.py --min-hit3 1.0
      - name: Rebuild outputs
        run: raroc simulate
      - uses: actions/upload-artifact@v4
        with:
          name: raroc-outputs
          path: |
            reports/
            docs/index.html
            evals/results/

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t commercial-lending-raroc:ci .
      - name: Smoke test container
        run: |
          docker run -d --name api -p 8000:8000 commercial-lending-raroc:ci
          for i in $(seq 1 30); do curl -sf localhost:8000/health && break; sleep 1; done
          curl -sf localhost:8000/relationships/key | python -c "import json,sys; assert len(json.load(sys.stdin)) == 10"
          curl -sf -X POST localhost:8000/price -H 'content-type: application/json' \
            -d '{"amount": 20000000, "rating": 5, "relationship_id": "R002"}'
          docker logs api | tail -5
